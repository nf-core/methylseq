# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "fastq_align_dedup_bwamem3"
description: Align TAPS reads with bwa-mem3 (`mem --meth=taps`), mark duplicates with Picard and collect samtools statistics
keywords:
  - taps
  - methylation
  - alignment
  - bwa-mem3
  - markduplicates
components:
  - bwamem3/mem
  - samtools/index
  - picard/markduplicates
  - bam_stats_samtools
input:
  - ch_reads:
      type: file
      description: |
        Channel containing reads
        Structure: [ val(meta), [ path(reads) ] ]
      pattern: "*.{fastq,fq}{,.gz}"
  - ch_fasta_fai:
      type: file
      description: |
        Channel containing the reference FASTA and its index
        Structure: [ val(meta), path(fasta), path(fai) ]
  - ch_bwamem3_index:
      type: directory
      description: |
        Channel containing a bwa-mem3 index built with `bwa-mem3 index --meth`
        Structure: [ val(meta), path(index) ]
  - skip_deduplication:
      type: boolean
      description: Skip Picard MarkDuplicates
output:
  - bam:
      type: file
      description: |
        Coordinate-sorted BAM, duplicate-marked unless skip_deduplication is set
        Structure: [ val(meta), path(bam) ]
      pattern: "*.bam"
  - bai:
      type: file
      description: |
        BAM index
        Structure: [ val(meta), path(bai) ]
      pattern: "*.bai"
  - multiqc:
      type: file
      description: Picard MarkDuplicates metrics and samtools stats, flagstat and idxstats files for MultiQC
authors:
  - "@eduard-watchmaker"
maintainers:
  - "@eduard-watchmaker"
