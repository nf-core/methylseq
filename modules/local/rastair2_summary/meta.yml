# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "rastair2_summary"
description: Summarise the rastair version 2 CpG methylation BED as MultiQC custom content (genome-wide and per-contig CpG methylation, CpG methylation distribution)
keywords:
  - taps
  - methylation
  - multiqc
  - rastair
tools:
  - "gawk":
      description: "GNU awk, used by bin/rastair2_summary.sh"
      homepage: "https://www.gnu.org/software/gawk/"
      licence: ["GPL-3.0-or-later"]
      identifier: ""
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information. e.g. `[ id:'sample1' ]`
    - bed:
        type: file
        description: bgzipped CpG methylation BED from `rastair call --bed`
        pattern: "*.bed.gz"
        ontologies: []
# `ext.args` is passed to the script as options: `-d <n>` sets the minimum informative reads per CpG for the
# methylation distribution (default 5), and `-c <contig,...>` names spike-in or control contigs to leave out of the
# genome-wide figures. The pipeline sets `-c` from `--rastair2_control_contigs`.
output:
  mqc:
    - - meta:
          type: map
          description: Groovy Map containing sample information. e.g. `[ id:'sample1' ]`
      - "*_mqc.tsv":
          type: file
          description: MultiQC custom content files (General Statistics, methylation distribution, per-contig methylation)
          pattern: "*_mqc.tsv"
          ontologies: []
  versions_gawk:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gawk:
          type: string
          description: The name of the tool
      - awk --version | sed '1!d; s/^GNU Awk //; s/,.*//':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gawk:
          type: string
          description: The name of the tool
      - awk --version | sed '1!d; s/^GNU Awk //; s/,.*//':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@eduard-watchmaker"
maintainers:
  - "@eduard-watchmaker"
