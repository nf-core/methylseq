# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "methylation_summary"
description: Summarise MethylDackel bedGraphs, Bismark coverage files or rastair 0.8 calls as MultiQC custom content (genome-wide CpG, CHG and CHH methylation, per-contig CpG methylation, CpG methylation distribution)
keywords:
  - bisulfite
  - methylation
  - multiqc
  - methyldackel
  - bismark
tools:
  - "gawk":
      description: "GNU awk, used by bin/methylation_summary.sh"
      homepage: "https://www.gnu.org/software/gawk/"
      licence: ["GPL-3.0-or-later"]
      identifier: ""
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information. e.g. `[ id:'sample1' ]`
    - calls:
        type: file
        description: |
          MethylDackel bedGraphs (`*_CpG.bedGraph`, and `*_CHG.bedGraph`/`*_CHH.bedGraph` with `--CHG --CHH`)
          or a Bismark coverage file (`*.cov.gz`, CpG context only), or with `-f rastair` in `ext.args`
          a rastair 0.8 call file (`*.rastair_call.txt`). Bismark coverage can come with the CX report
          (`*.controls.CX_report.txt.gz`) and alignment report (`controls.*_report.txt`) of a separate
          spike-in control alignment: every contig of the CX report is a control.
        pattern: "*.{bedGraph,cov.gz,rastair_call.txt,CX_report.txt.gz,report.txt}"
        ontologies: []
# `ext.args` is passed to the script as options: `-n <name>` sets the tool name used in the MultiQC IDs and
# column names (methyldackel, bismark or rastair), `-d <n>` the minimum informative reads per CpG for the methylation
# distribution (default 5), and `-c <contig,...>` names spike-in or control contigs to leave out of the
# genome-wide figures. For several summaries per sample (for example one per target panel), `-l <label>` adds the
# label to the file names, MultiQC IDs, column names and titles, and `-H` hides the General Statistics columns by
# default. The pipeline sets `-n` from `--aligner` and `-c` from `--control_contigs`.
output:
  mqc:
    - - meta:
          type: map
          description: Groovy Map containing sample information. e.g. `[ id:'sample1' ]`
      - "*_mqc.tsv":
          type: file
          description: MultiQC custom content files (General Statistics, methylation distribution, per-contig methylation)
          pattern: "*_mqc.tsv"
          ontologies: []
  versions_gawk:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gawk:
          type: string
          description: The name of the tool
      - awk --version | sed '1!d; s/^GNU Awk //; s/,.*//':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gawk:
          type: string
          description: The name of the tool
      - awk --version | sed '1!d; s/^GNU Awk //; s/,.*//':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@eduard-watchmaker"
maintainers:
  - "@eduard-watchmaker"
